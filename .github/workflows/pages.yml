name: documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0
        with:
          node-version: 24.18.1
      - run: npm install --global npm@11.16.0

      - name: Install indexer dependencies
        run: npm ci

      - name: Install documentation dependencies
        run: npm ci --prefix site

      # Regenerate the API reference from the real controllers and fail if the
      # committed document is out of date.
      - name: Regenerate the OpenAPI document
        run: npm run openapi:emit

      - name: Fail if the committed OpenAPI document is stale
        run: git diff --exit-code -- site/src/data/openapi.json

      - name: Check writing rules
        run: npm run prose --prefix site

      - name: Type check the site
        run: npm run check --prefix site

      - name: Build the site
        run: npm run build --prefix site

      - name: Build social preview images
        run: npm run og --prefix site

      - name: Check every internal link
        run: npm run links --prefix site

      - name: Run documentation tests
        run: npm test --prefix site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # Only the default branch publishes. Pull requests build and verify only.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
