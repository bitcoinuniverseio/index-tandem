name: documentation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      verified_asset_id:
        description: 'Owned release asset containing the already verified site'
        type: string
      verified_asset_sha256:
        description: 'SHA256 of the verified site archive'
        type: string
      verified_source_commit:
        description: 'Full source commit used for the verified build'
        type: string

permissions:
  contents: read
  id-token: write
  pages: write

# One group per ref. A shared group made a queued develop push run get
# cancelled whenever a pull request run queued behind it. Only main
# deploys, so Pages deployments stay serialized within refs/heads/main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 20
    steps:
      # Restore the GitHub-native artifact endpoints that the RunsOn s3-cache
      # extra rewrites, so uploading the Pages artifact works on Spot runners.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1
      - name: Reuse the verified documentation build
        if: inputs.verified_asset_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ASSET_ID: ${{ inputs.verified_asset_id }}
          VERIFIED_ASSET_SHA256: ${{ inputs.verified_asset_sha256 }}
          VERIFIED_SOURCE_COMMIT: ${{ inputs.verified_source_commit }}
        run: node site/scripts/reuse-verified-build.mjs
      - name: Install documentation dependencies
        if: inputs.verified_asset_id == ''
        run: npm ci --prefix site

      # Regenerate the API reference from the real controllers and fail if the
      # committed document is out of date.
      - name: Regenerate the OpenAPI document
        if: inputs.verified_asset_id == ''
        run: npm run openapi:emit

      - name: Fail if the committed OpenAPI document is stale
        if: inputs.verified_asset_id == ''
        run: git diff --exit-code -- site/src/data/openapi.json

      - name: Check writing rules
        if: inputs.verified_asset_id == ''
        run: npm run prose --prefix site

      - name: Type check the site
        if: inputs.verified_asset_id == ''
        run: npm run check --prefix site

      - name: Build the site
        if: inputs.verified_asset_id == ''
        run: npm run build --prefix site

      - name: Build social preview images
        if: inputs.verified_asset_id == ''
        run: npm run og --prefix site

      - name: Check every internal link
        if: inputs.verified_asset_id == ''
        run: npm run links --prefix site

      - name: Run documentation tests
        if: inputs.verified_asset_id == ''
        run: npm test --prefix site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    # Only the default branch publishes. Pull requests build and verify only.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build]
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # See the build job: deploy-pages reads the artifact service as well.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
