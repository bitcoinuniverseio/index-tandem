name: verify

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets: inherit
    with:
      plan: '{"verify":"light"}'
      config_ref: 1dd19289af21f4f6be01f874390a180b3af8bb38

  verify:
    needs: route
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.route.outputs.targets).verify }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1
      - run: npm run verify
      - run: npm audit --audit-level=high
